[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tricore-arch"
version = "1.6.0"
description = "Attention-free constant-state operator with zero-prior autonomous syntax discovery, Delta-rule fast weights, static-plus-multi-round state mutation, native O(1) streaming, and 100% fair Engine ablations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TriCore contributors" }]
keywords = ["pytorch", "sequence-modeling", "fast-weights", "associative-memory", "torchscript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["tricore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
