[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-tricore"
version = "1.6.3"
description = "Bedrock-TriCore: An Attention-Free, Constant-State O(1) Sequence Operator (17.00 KiB) with Causal Delta-Rule Fast Weights and Latent Multi-Hop Chaining"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Liang Chenxu (ASYS Tech)"}
]
keywords = ["deep-learning", "pytorch", "sequence-modeling", "fast-weights", "delta-rule", "sub-quadratic", "attention-free", "tricore", "bedrock"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Liangchenxu/bedrock-tricore"
Repository = "https://github.com/Liangchenxu/bedrock-tricore"
Documentation = "https://github.com/Liangchenxu/bedrock-tricore#readme"
"Bug Tracker" = "https://github.com/Liangchenxu/bedrock-tricore/issues"
"PyPI Package" = "https://pypi.org/project/bedrock-tricore/"

[tool.setuptools.packages.find]
where = ["."]
include = ["tricore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
